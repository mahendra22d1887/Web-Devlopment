<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            font-family: cursive;
            background-color: bisque;
        }
        .con{
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            background-color: black;
        }
        .product{
            color: red;
            background-color: white;
            justify-content: center;
            text-align: center;
            padding: 15px;
            margin: 15px;
            border: 1px solid black;
            border-radius: 12px;
            overflow: hidden;

        }
        .product img{
            height: 150px;
            width: 150px;
        }
        .product button{
            background-color: yellowgreen;
            padding: 6px;
            border: none;
            border-radius: 12px;
            cursor: pointer; 
        }
        .product button:hover{
            transform: scale(1.04);
        }
        
    </style>
</head>
<body>
    <div class="con">
        <div class="product">
            <img src="https://images.pexels.com/photos/5269752/pexels-photo-5269752.jpeg">
            <h2>Headphone</h2>
            <p><del>$100</del> $80</p>
            <button>Add to cart</button>
        </div>
         <div class="product">
            <img src="https://images.pexels.com/photos/7857501/pexels-photo-7857501.jpeg">
            <h2>shoes</h2>
            <p><del>$50</del> $20</p>
            <button>Add to cart</button>
        </div>
         <div class="product">
            <img src="https://images.pexels.com/photos/5274793/pexels-photo-5274793.jpeg">
            <h2>Water Bottle</h2>
            <p><del>$10</del> $8</p>
            <button>Add to cart</button>
        </div>
         <div class="product">
            <img src="https://images.pexels.com/photos/11100267/pexels-photo-11100267.jpeg">
            <h2>Shirt</h2>
            <p><del>8</del> $4</p>
            <button>Add to cart</button>
        </div>
    </div>

    <div class="con">
        <div class="product">
            <img src="https://images.pexels.com/photos/1769106/pexels-photo-1769106.jpeg">
            <h2>Mobile</h2>
            <p><del>$600</del> $400</p>
            <button>Add to cart</button>
        </div>
         <div class="product">
            <img src="https://images.pexels.com/photos/8200898/pexels-photo-8200898.jpeg">
            <h2>Books</h2>
            <p><del>$50</del> $30</p>
            <button>Add to cart</button>
        </div>
         <div class="product">
            <img src="https://images.pexels.com/photos/3663060/pexels-photo-3663060.jpeg">

            <p><del>$10</del> $8</p>
            <button>Add to cart</button>
        </div>

            <img src="https://images.pexels.com/photos/10423281/pexels-photo-10423281.jpeg">
            <h2>>Guitar</h2>
            <p><del>80</del> $60</p>
            <button>Add to cart</button>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid black;
            width: 100px;
            height: 100px;
            padding: 10px;
            background-color: antiquewhite;
            font-style: italic;
            font-family: cursive;
        }
        .product{
            display: flex;
            /* justified content for x axis */
            justify-content: center;
            gap: 20px;
            /* align-item - for y axis */
            align-items: center;

            height: 400px;
            background-color: beige;
            border: 1px solid black;
            
        }
    </style>
</head>
<body>
    <!-- flex gives display in one dimension -> either row or column  -->
    <div class="product">
    <div class="box">Cake</div>
    <div class="box">Cookie</div>
    <div class="box">Pastery</div>
    </div>
</body>
</html>

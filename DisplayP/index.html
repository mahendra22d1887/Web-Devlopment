<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
            font-size: 22px;
            font-family: cursive;
        }
        p .ex1{
            display: none;
        }
        p.ex2{
            display: block;
            background-color: blueviolet;
        }
        p.ex3{
            display: inline;
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>display Properties</h1>
    <h1>display : None</h1>
    <div>
        Here the function disable is none
        <p class="ex1"> Hello display None</p>
    </div>

    <h1>Display : Block</h1>
    <div>
        It is similar like Div container
        <p class="ex2">Hello display block</p>
    </div>
        
    <h1>display : None</h1>
    <div>
        It is similar span tag
        <p class="ex3"> Hello display Inline</p>
    </div>    
    
    <!-- flex - one dimension dislay either row or column -->
    <!-- flex by defalut row format -->
</body>
</html>

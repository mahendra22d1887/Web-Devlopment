<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data types in JavaScript</h1>
    <script>
      // types of data
      
      // 1. string = text "anything in double quotes"
      var username = "AgnetMahi"
      console.log(username)
      console.log(typeof(username))

      //2.  Number -> +ve , -ve , DecimalNumber

      var age = 34
      console.log(typeof(age))

      //3. boolean -> value is true is flase
      var isLoggedIn = true
      console.log(typeof(isLoggedIn))

      //4. Undefined data type
      var a
      console.log(typeof(a))

      //5.Null
      var b = null
      console.log(typeof(b)) // object

      // multiple value -> use concept for array
    </script>
</body>
</html>

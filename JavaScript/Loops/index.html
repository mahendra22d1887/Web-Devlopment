<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // loop
        // print 1 to 10
        for (let i = 1; i <= 10; i++) {
            console.log(i)
            //alert(i)
        }
        // while loop
        let i = 1
        while(i<=10)
        {
           console.log(10*i)
           i++
        }
        // do while
        // ek bar tho loop chalega hi condition true ho ya false
        do {
            console.log("Meow ")
        } while (i<-2);
    </script>
</body>
</html>

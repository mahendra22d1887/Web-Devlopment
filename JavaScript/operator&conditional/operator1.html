<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // logical operator
        //AND operator -> && if both condition is true output true
        
        var isMember = true
        let totalPrice = 300

        console.log(isMember && totalPrice>500)

        // OR operator -> || if only one condition is ture
         console.log(isMember || totalprice > 500)

         // comparsion - two values
         const a = 10
         const b = "10"
         console.log(a==b) // it will only see value not datatype so answer true
         console.log(a===b) // triple equal check value and datatype


    </script>
</body>
</html>

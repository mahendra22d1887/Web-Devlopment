<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // math object - Random no between 1 to 6

        let luckyNo = Math.floor(Math.random() * 6) + 1
        console.log(luckyNo)
        // game logic
        while(true){
            let num = prompt('Enter the numner b/w 1 to 6')
            if(num==luckyNo){
                alert("You won the game")
                break
            }
            else{
                alert('Better Luck next time')
            }
       
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // array
        // advantage is js Array - can be of different datatype
        // symbol - [] square bracket
        // Rule : index number start with 0

        let students = ["agent", "mahi", "hitman" ,"kratos"]
        console.log(students)
        console.log(students[2])

        // collection of object
        // object - It is used to store multiple data/ value at the same time
        // Format : key(left):value(right) pair

        let employe1= {agent:"47", email:"agent47@gmail.com", id:123 , salary:60000}
        console.log(employe1.salary) // objectname.keyName
    </script>
</body>
</html>

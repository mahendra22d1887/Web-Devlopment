<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abc{
            background-color: aqua;
            height: 200px;
            width: 200px;
            text-align: center;
            color: white;
            margin: auto;

            transition: 3s;
        }
        /* hover - When we move our mouse and it change the style  */
        #magic:hover{
            transform: scale(1.2);   
            /*scale(1-original.change of size value) it is used to change the size of tag  */
            background-color: red;

            /* transform: rotate(360deg); */
            /* transform: rotatex(360deg); */

            /* transform: translatex(-100px); */
            transform: translateY(100px);
        }
    </style>
</head>
<body>
    <div class="abc" id="magic">
     <h1>Agent</h1>
    </div>
</body>
</html>

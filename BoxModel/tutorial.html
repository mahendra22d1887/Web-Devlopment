<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: beige;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product{
            background-color: white;
            border: 0.5px solid black;
            margin: 30px;
            padding: 25px;
            border-radius: 12px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 5px 12px black;
            /* border-shadow: x-aaxi , y-axis, spreadvalue */
        }
        .product img{
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
        }
        .product button{
            background-color: orange;
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }
        button:hover{
           background-color: darkgoldenrod;
           transition: 2s;
           transform: scale(1.03);
        }
    </style>
</head>
<body>
    
    <!-- box model - maargin ,padding , border -->
     <!-- border: value Type color
       e.g. border: 1px solid black -->
    <!-- padding: space inside border- 4 direction -->
     <!-- margin: outside space border in 4 direction -->
      <div class="product">
        <img src="https://images.pexels.com/photos/3945672/pexels-photo-3945672.jpeg">
        <h2>iPhone</h2>
        <p><del>$700</del>  $400</p>
        <button>Add to cart</button>
      </div>

      <div class="product">
        <img src="https://images.pexels.com/photos/6893890/pexels-photo-6893890.jpeg" height="100" width="100" >
        <h2>Laptop</h2>
        <p>$500</p>
        <button>Add to cart</button>
      </div>

       <div class="product">
        <img src="https://images.pexels.com/photos/28254029/pexels-photo-28254029.jpeg" height="100" width="100">
        <h2>Camera</h2>
        <p>$900</p>
        <button>Add to cart</button>
      </div>

</body>
</html>
